# Base configuration shared by every node.
# NodeSettings overrides host, port, roles and seed-nodes from env vars.

pekko {
  actor {
    provider = "cluster"

    # Application messages cross node boundaries with Jackson CBOR.
    serialization-bindings {
      "ass04.CborSerializable" = jackson-cbor
    }
  }

  remote.artery {
    canonical.hostname = "127.0.0.1"
    canonical.port = 25520
    # Bind on every interface inside Docker; the advertised address remains
    # the canonical hostname (the Compose service name).
    bind.hostname = "0.0.0.0"
  }

  cluster {
    # NodeSettings replaces this list for real deployments.
    seed-nodes = []
    roles = []

    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver {
      active-strategy = keep-majority
      stable-after = 10s
    }

    shutdown-after-unsuccessful-join-seed-nodes = 60s

    sharding {
      # The alarm FSM holds its state in memory: do not passivate it just
      # because no message arrived for a while.
      passivation.strategy = "off"
      number-of-shards = 100
    }
  }

  loglevel = "INFO"
  stdout-loglevel = "INFO"
}
